name: Build AnimateBlock Jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Mod Files
        run: |
          mkdir -p src/main/resources/assets/animateblock/lang
          mkdir -p src/main/resources/assets/animateblock/models/item
          mkdir -p src/main/java/com/animateblock/item
          mkdir -p src/main/java/com/animateblock/timeline
          mkdir -p src/main/java/com/animateblock/network
          mkdir -p src/main/java/com/animateblock/server
          mkdir -p src/main/java/com/animateblock/client/gui

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.1
          yarn_mappings=1.21.1+build.3
          loader_version=0.16.5
          loom_version=1.7-SNAPSHOT
          fabric_version=0.104.0+1.21.1
          mod_version=1.0.0
          maven_group=com.animateblock
          archives_base_name=animateblock
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  maven {
                      name = 'Fabric'
                      url = 'https://maven.fabricmc.net/'
                  }
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'fabric-loom' version '1.7-SNAPSHOT'
              id 'maven-publish'
          }

          version = project.mod_version
          group = project.maven_group

          base {
              archivesName = project.archives_base_name
          }

          repositories {
              mavenCentral()
          }

          dependencies {
              minecraft "com.mojang:minecraft:${project.minecraft_version}"
              mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
              modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
              modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }

          processResources {
              inputs.property "version", project.version
              filesMatching("fabric.mod.json") {
                  expand "version": project.version
              }
          }

          tasks.withType(JavaCompile).configureEach {
              it.options.release = 21
          }

          java {
              sourceCompatibility = JavaVersion.VERSION_21
              targetCompatibility = JavaVersion.VERSION_21
          }
          EOF

          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "animateblock",
            "version": "${version}",
            "name": "AnimateBlock CapCut Mod",
            "description": "CapCut-style timeline editor for animating blocks, transitions, graphs, particles, and sounds.",
            "authors": ["AnimateBlock"],
            "license": "MIT",
            "environment": "*",
            "entrypoints": {
              "main": ["com.animateblock.AnimateBlockMod"],
              "client": ["com.animateblock.client.AnimateBlockClient"]
            },
            "depends": {
              "fabricloader": ">=0.16.0",
              "minecraft": "~1.21.1",
              "java": ">=21",
              "fabric-api": "*"
            }
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/animateblock/lang/en_us.json
          {
            "item.animateblock.animate_block": "AnimateBlock"
          }
          EOF

          cat << 'EOF' > src/main/resources/assets/animateblock/models/item/animate_block.json
          {
            "parent": "minecraft:item/wooden_axe"
          }
          EOF

          cat << 'EOF' > src/main/java/com/animateblock/item/AnimateBlockItem.java
          package com.animateblock.item;

          import net.minecraft.block.BlockState;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.tooltip.TooltipType;
          import net.minecraft.text.Text;
          import net.minecraft.util.Formatting;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.world.World;
          import java.util.List;

          public class AnimateBlockItem extends Item {
              public AnimateBlockItem(Settings settings) {
                  super(settings);
              }

              @Override
              public boolean hasGlint(ItemStack stack) {
                  return true;
              }

              @Override
              public Text getName(ItemStack stack) {
                  return Text.literal("AnimateBlock").formatted(Formatting.AQUA, Formatting.BOLD);
              }

              @Override
              public boolean canMine(BlockState state, World world, BlockPos pos, PlayerEntity miner) {
                  return false;
              }

              @Override
              public void appendTooltip(ItemStack stack, TooltipContext context, List<Text> tooltip, TooltipType type) {
                  tooltip.add(Text.literal("Right-Click block: ").formatted(Formatting.GRAY)
                          .append(Text.literal("Select block to animate").formatted(Formatting.YELLOW)));
                  tooltip.add(Text.literal("Shift + Right-Click: ").formatted(Formatting.GRAY)
                          .append(Text.literal("Copy target Move position").formatted(Formatting.GREEN)));
                  tooltip.add(Text.literal("Left-Click (Break): ").formatted(Formatting.GRAY)
                          .append(Text.literal("Open CapCut Timeline Menu").formatted(Formatting.AQUA)));
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/animateblock/timeline/AnimationData.java
          package com.animateblock.timeline;

          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.nbt.NbtElement;
          import net.minecraft.nbt.NbtList;
          import net.minecraft.util.math.BlockPos;
          import java.util.ArrayList;
          import java.util.Comparator;
          import java.util.List;

          public class AnimationData {
              public enum EasingGraph {
                  LINEAR("Linear"),
                  EASE_IN("Ease In"),
                  QUAD_IN("Quad In"),
                  CUBIC_IN("Cubic In"),
                  EASE_OUT("Ease Out"),
                  QUAD_OUT("Quad Out");

                  public final String label;
                  EasingGraph(String label) { this.label = label; }

                  public double apply(double t) {
                      t = Math.max(0.0, Math.min(1.0, t));
                      return switch (this) {
                          case LINEAR -> t;
                          case EASE_IN -> 1.0 - Math.cos((t * Math.PI) / 2.0);
                          case QUAD_IN -> t * t;
                          case CUBIC_IN -> t * t * t;
                          case EASE_OUT -> Math.sin((t * Math.PI) / 2.0);
                          case QUAD_OUT -> 1.0 - (1.0 - t) * (1.0 - t);
                      };
                  }
              }

              public enum EffectType {
                  SMOKE("Smoke"),
                  SHAKE_BLOCK("ShakeBlock"),
                  SMOOTH_SHAKE("SmoothShake"),
                  FIRE("Fire"),
                  EXPLODE("Explode"),
                  FIRE_EXPLODE("FireExplode");

                  public final String label;
                  EffectType(String label) { this.label = label; }
              }

              public static class MoveKeyframe {
                  public float time;
                  public double dx, dy, dz;
                  public EasingGraph graph;

                  public MoveKeyframe(float time, double dx, double dy, double dz, EasingGraph graph) {
                      this.time = time;
                      this.dx = dx;
                      this.dy = dy;
                      this.dz = dz;
                      this.graph = graph;
                  }
              }

              public static class VisibilityKeyframe {
                  public float time;
                  public boolean showBlock;

                  public VisibilityKeyframe(float time, boolean showBlock) {
                      this.time = time;
                      this.showBlock = showBlock;
                  }
              }

              public static class EffectKeyframe {
                  public float time;
                  public EffectType effectType;
                  public boolean showEffect;
                  public EasingGraph graph;

                  public EffectKeyframe(float time, EffectType effectType, boolean showEffect, EasingGraph graph) {
                      this.time = time;
                      this.effectType = effectType;
                      this.showEffect = showEffect;
                      this.graph = graph;
                  }
              }

              public static class SoundKeyframe {
                  public float time;
                  public String soundId;

                  public SoundKeyframe(float time, String soundId) {
                      this.time = time;
                      this.soundId = soundId;
                  }
              }

              public BlockPos originPos;
              public float duration = 10.0f;
              public boolean playing = false;
              public boolean loop = true;
              public float currentTime = 0.0f;

              public final List<MoveKeyframe> moveKeyframes = new ArrayList<>();
              public final List<VisibilityKeyframe> visibilityKeyframes = new ArrayList<>();
              public final List<EffectKeyframe> effectKeyframes = new ArrayList<>();
              public final List<SoundKeyframe> soundKeyframes = new ArrayList<>();

              public AnimationData(BlockPos originPos) {
                  this.originPos = originPos;
                  this.moveKeyframes.add(new MoveKeyframe(0.0f, 0.0, 0.0, 0.0, EasingGraph.LINEAR));
                  this.visibilityKeyframes.add(new VisibilityKeyframe(0.0f, true));
              }

              public void sortAll() {
                  moveKeyframes.sort(Comparator.comparingDouble(k -> k.time));
                  visibilityKeyframes.sort(Comparator.comparingDouble(k -> k.time));
                  effectKeyframes.sort(Comparator.comparingDouble(k -> k.time));
                  soundKeyframes.sort(Comparator.comparingDouble(k -> k.time));
              }

              public NbtCompound toNbt() {
                  NbtCompound nbt = new NbtCompound();
                  nbt.putInt("ox", originPos.getX());
                  nbt.putInt("oy", originPos.getY());
                  nbt.putInt("oz", originPos.getZ());
                  nbt.putFloat("duration", duration);
                  nbt.putBoolean("playing", playing);
                  nbt.putBoolean("loop", loop);
                  nbt.putFloat("currentTime", currentTime);

                  NbtList moveList = new NbtList();
                  for (MoveKeyframe k : moveKeyframes) {
                      NbtCompound c = new NbtCompound();
                      c.putFloat("t", k.time);
                      c.putDouble("dx", k.dx);
                      c.putDouble("dy", k.dy);
                      c.putDouble("dz", k.dz);
                      c.putString("g", k.graph.name());
                      moveList.add(c);
                  }
                  nbt.put("moves", moveList);

                  NbtList visList = new NbtList();
                  for (VisibilityKeyframe k : visibilityKeyframes) {
                      NbtCompound c = new NbtCompound();
                      c.putFloat("t", k.time);
                      c.putBoolean("show", k.showBlock);
                      visList.add(c);
                  }
                  nbt.put("vis", visList);

                  NbtList effList = new NbtList();
                  for (EffectKeyframe k : effectKeyframes) {
                      NbtCompound c = new NbtCompound();
                      c.putFloat("t", k.time);
                      c.putString("type", k.effectType.name());
                      c.putBoolean("show", k.showEffect);
                      c.putString("g", k.graph.name());
                      effList.add(c);
                  }
                  nbt.put("effects", effList);

                  NbtList sndList = new NbtList();
                  for (SoundKeyframe k : soundKeyframes) {
                      NbtCompound c = new NbtCompound();
                      c.putFloat("t", k.time);
                      c.putString("id", k.soundId);
                      sndList.add(c);
                  }
                  nbt.put("sounds", sndList);
                  return nbt;
              }

              public static AnimationData fromNbt(NbtCompound nbt) {
                  BlockPos pos = new BlockPos(nbt.getInt("ox"), nbt.getInt("oy"), nbt.getInt("oz"));
                  AnimationData data = new AnimationData(pos);
                  data.moveKeyframes.clear();
                  data.visibilityKeyframes.clear();
                  data.effectKeyframes.clear();
                  data.soundKeyframes.clear();

                  data.duration = nbt.getFloat("duration");
                  if (data.duration <= 0.5f) data.duration = 10.0f;
                  data.playing = nbt.getBoolean("playing");
                  data.loop = nbt.getBoolean("loop");
                  data.currentTime = nbt.getFloat("currentTime");

                  NbtList moveList = nbt.getList("moves", NbtElement.COMPOUND_TYPE);
                  for (int i = 0; i < moveList.size(); i++) {
                      NbtCompound c = moveList.getCompound(i);
                      EasingGraph g = EasingGraph.LINEAR;
                      try { g = EasingGraph.valueOf(c.getString("g")); } catch (Exception ignored) {}
                      data.moveKeyframes.add(new MoveKeyframe(c.getFloat("t"), c.getDouble("dx"), c.getDouble("dy"), c.getDouble("dz"), g));
                  }

                  NbtList visList = nbt.getList("vis", NbtElement.COMPOUND_TYPE);
                  for (int i = 0; i < visList.size(); i++) {
                      NbtCompound c = visList.getCompound(i);
                      data.visibilityKeyframes.add(new VisibilityKeyframe(c.getFloat("t"), c.getBoolean("show")));
                  }

                  NbtList effList = nbt.getList("effects", NbtElement.COMPOUND_TYPE);
                  for (int i = 0; i < effList.size(); i++) {
                      NbtCompound c = effList.getCompound(i);
                      EffectType type = EffectType.SMOKE;
                      try { type = EffectType.valueOf(c.getString("type")); } catch (Exception ignored) {}
                      EasingGraph g = EasingGraph.LINEAR;
                      try { g = EasingGraph.valueOf(c.getString("g")); } catch (Exception ignored) {}
                      data.effectKeyframes.add(new EffectKeyframe(c.getFloat("t"), type, c.getBoolean("show"), g));
                  }

                  NbtList sndList = nbt.getList("sounds", NbtElement.COMPOUND_TYPE);
                  for (int i = 0; i < sndList.size(); i++) {
                      NbtCompound c = sndList.getCompound(i);
                      data.soundKeyframes.add(new SoundKeyframe(c.getFloat("t"), c.getString("id")));
                  }

                  data.sortAll();
                  return data;
              }

              public double[] evaluatePositionOffset(float time) {
                  if (moveKeyframes.isEmpty()) return new double[]{0, 0, 0};
                  if (time <= moveKeyframes.getFirst().time) {
                      MoveKeyframe first = moveKeyframes.getFirst();
                      return new double[]{first.dx, first.dy, first.dz};
                  }
                  if (time >= moveKeyframes.getLast().time) {
                      MoveKeyframe last = moveKeyframes.getLast();
                      return new double[]{last.dx, last.dy, last.dz};
                  }
                  for (int i = 0; i < moveKeyframes.size() - 1; i++) {
                      MoveKeyframe a = moveKeyframes.get(i);
                      MoveKeyframe b = moveKeyframes.get(i + 1);
                      if (time >= a.time && time <= b.time) {
                          double span = Math.max(0.0001, b.time - a.time);
                          double rawT = (time - a.time) / span;
                          double easedT = b.graph.apply(rawT);
                          return new double[]{
                                  a.dx + (b.dx - a.dx) * easedT,
                                  a.dy + (b.dy - a.dy) * easedT,
                                  a.dz + (b.dz - a.dz) * easedT
                          };
                      }
                  }
                  return new double[]{0, 0, 0};
              }

              public boolean evaluateVisibility(float time) {
                  boolean visible = true;
                  for (VisibilityKeyframe k : visibilityKeyframes) {
                      if (k.time <= time + 0.001f) {
                          visible = k.showBlock;
                      } else {
                          break;
                      }
                  }
                  return visible;
              }

              public boolean isEffectActive(EffectType type, float time) {
                  boolean active = false;
                  for (EffectKeyframe k : effectKeyframes) {
                      if (k.effectType == type) {
                          if (k.time <= time + 0.001f) {
                              active = k.showEffect;
                          } else {
                              break;
                          }
                      }
                  }
                  return active;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/animateblock/network/SyncTimelinePayload.java
          package com.animateblock.network;

          import com.animateblock.AnimateBlockMod;
          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.network.RegistryByteBuf;
          import net.minecraft.network.codec.PacketCodec;
          import net.minecraft.network.codec.PacketCodecs;
          import net.minecraft.network.packet.CustomPayload;
          import net.minecraft.util.Identifier;

          public record SyncTimelinePayload(NbtCompound nbt, boolean stopAndRestore) implements CustomPayload {
              public static final CustomPayload.Id<SyncTimelinePayload> ID =
                      new CustomPayload.Id<>(Identifier.of(AnimateBlockMod.MOD_ID, "sync_timeline"));

              public static final PacketCodec<RegistryByteBuf, SyncTimelinePayload> CODEC = PacketCodec.tuple(
                      PacketCodecs.NBT_COMPOUND, SyncTimelinePayload::nbt,
                      PacketCodecs.BOOL, SyncTimelinePayload::stopAndRestore,
                      SyncTimelinePayload::new
              );

              @Override
              public Id<? extends CustomPayload> getId() {
                  return ID;
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/animateblock/server/ServerAnimationManager.java
          package com.animateblock.server;

          import com.animateblock.timeline.AnimationData;
          import net.minecraft.block.BlockState;
          import net.minecraft.block.Blocks;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.EntityType;
          import net.minecraft.entity.decoration.DisplayEntity;
          import net.minecraft.nbt.NbtCompound;
          import net.minecraft.nbt.NbtHelper;
          import net.minecraft.particle.ParticleTypes;
          import net.minecraft.registry.Registries;
          import net.minecraft.server.MinecraftServer;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.sound.SoundCategory;
          import net.minecraft.sound.SoundEvent;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.math.BlockPos;
          import net.minecraft.util.math.random.Random;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.Map;
          import java.util.UUID;

          public class ServerAnimationManager {
              private static class ActiveBlockAnimation {
                  final ServerWorld world;
                  final BlockPos originPos;
                  final BlockState originalState;
                  AnimationData data;
                  UUID displayEntityUuid;
                  float prevTime = -1.0f;
                  boolean currentlyVisible = true;

                  ActiveBlockAnimation(ServerWorld world, BlockPos originPos, BlockState originalState, AnimationData data) {
                      this.world = world;
                      this.originPos = originPos;
                      this.originalState = originalState;
                      this.data = data;
                  }
              }

              private static final Map<BlockPos, ActiveBlockAnimation> ACTIVE = new HashMap<>();

              public static void updateOrStart(ServerWorld world, AnimationData incoming, boolean stopAndRestore) {
                  BlockPos pos = incoming.originPos;
                  ActiveBlockAnimation existing = ACTIVE.get(pos);

                  if (stopAndRestore) {
                      if (existing != null) {
                          restoreBlock(existing);
                          ACTIVE.remove(pos);
                      }
                      return;
                  }

                  if (existing == null) {
                      BlockState currentWorldState = world.getBlockState(pos);
                      if (currentWorldState.isAir()) {
                          currentWorldState = Blocks.OAK_PLANKS.getDefaultState();
                      }
                      existing = new ActiveBlockAnimation(world, pos, currentWorldState, incoming);
                      ACTIVE.put(pos, existing);
                      world.setBlockState(pos, Blocks.AIR.getDefaultState(), 3);
                      spawnDisplayEntity(existing);
                  } else {
                      existing.data = incoming;
                  }

                  applyFrame(existing, incoming.currentTime, false);
              }

              private static void spawnDisplayEntity(ActiveBlockAnimation anim) {
                  DisplayEntity.BlockDisplayEntity display = new DisplayEntity.BlockDisplayEntity(EntityType.BLOCK_DISPLAY, anim.world);
                  display.setPosition(anim.originPos.getX(), anim.originPos.getY(), anim.originPos.getZ());
                  NbtCompound nbt = new NbtCompound();
                  display.writeNbt(nbt);
                  nbt.put("block_state", NbtHelper.fromBlockState(anim.originalState));
                  nbt.putInt("teleport_duration", 1);
                  display.readNbt(nbt);
                  display.setPosition(anim.originPos.getX(), anim.originPos.getY(), anim.originPos.getZ());
                  anim.world.spawnEntity(display);
                  anim.displayEntityUuid = display.getUuid();
              }

              private static DisplayEntity.BlockDisplayEntity getDisplay(ActiveBlockAnimation anim) {
                  if (anim.displayEntityUuid == null) return null;
                  Entity e = anim.world.getEntity(anim.displayEntityUuid);
                  if (e instanceof DisplayEntity.BlockDisplayEntity bde) {
                      return bde;
                  }
                  return null;
              }

              private static void restoreBlock(ActiveBlockAnimation anim) {
                  DisplayEntity.BlockDisplayEntity display = getDisplay(anim);
                  if (display != null) {
                      display.discard();
                  }
                  anim.world.setBlockState(anim.originPos, anim.originalState, 3);
              }

              public static void tick(MinecraftServer server) {
                  Iterator<Map.Entry<BlockPos, ActiveBlockAnimation>> it = ACTIVE.entrySet().iterator();
                  while (it.hasNext()) {
                      ActiveBlockAnimation anim = it.next().getValue();
                      if (anim.data.playing) {
                          float prev = anim.data.currentTime;
                          anim.data.currentTime += 0.05f;
                          if (anim.data.currentTime > anim.data.duration) {
                              if (anim.data.loop) {
                                  anim.data.currentTime = 0.0f;
                                  anim.prevTime = -1.0f;
                              } else {
                                  anim.data.currentTime = anim.data.duration;
                                  anim.data.playing = false;
                              }
                          }
                          applyFrame(anim, anim.data.currentTime, true);
                          anim.prevTime = prev;
                      }
                  }
              }

              private static void applyFrame(ActiveBlockAnimation anim, float time, boolean triggerEvents) {
                  DisplayEntity.BlockDisplayEntity display = getDisplay(anim);
                  if (display == null) {
                      spawnDisplayEntity(anim);
                      display = getDisplay(anim);
                      if (display == null) return;
                  }

                  boolean visible = anim.data.evaluateVisibility(time);
                  if (visible != anim.currentlyVisible) {
                      anim.currentlyVisible = visible;
                      NbtCompound nbt = new NbtCompound();
                      display.writeNbt(nbt);
                      nbt.put("block_state", NbtHelper.fromBlockState(visible ? anim.originalState : Blocks.AIR.getDefaultState()));
                      display.readNbt(nbt);
                  }

                  double[] offset = anim.data.evaluatePositionOffset(time);
                  double x = anim.originPos.getX() + offset[0];
                  double y = anim.originPos.getY() + offset[1];
                  double z = anim.originPos.getZ() + offset[2];

                  Random rng = anim.world.getRandom();

                  if (anim.data.isEffectActive(AnimationData.EffectType.SHAKE_BLOCK, time)) {
                      x += (rng.nextDouble() - 0.5) * 0.35;
                      y += (rng.nextDouble() - 0.5) * 0.35;
                      z += (rng.nextDouble() - 0.5) * 0.35;
                  }
                  if (anim.data.isEffectActive(AnimationData.EffectType.SMOOTH_SHAKE, time)) {
                      x += Math.sin(time * 18.0) * 0.18;
                      y += Math.cos(time * 14.0) * 0.12;
                      z += Math.sin(time * 15.0 + 1.2) * 0.18;
                  }

                  display.requestTeleport(x, y, z);

                  double cx = x + 0.5;
                  double cy = y + 0.5;
                  double cz = z + 0.5;

                  if (anim.data.isEffectActive(AnimationData.EffectType.SMOKE, time)) {
                      anim.world.spawnParticles(ParticleTypes.LARGE_SMOKE, cx, cy, cz, 4, 0.3, 0.3, 0.3, 0.02);
                      anim.world.spawnParticles(ParticleTypes.CAMPFIRE_COSY_SMOKE, cx, cy + 0.3, cz, 2, 0.2, 0.2, 0.2, 0.01);
                  }
                  if (anim.data.isEffectActive(AnimationData.EffectType.FIRE, time)) {
                      anim.world.spawnParticles(ParticleTypes.FLAME, cx, cy, cz, 6, 0.35, 0.35, 0.35, 0.03);
                      anim.world.spawnParticles(ParticleTypes.LAVA, cx, cy, cz, 1, 0.2, 0.2, 0.2, 0.0);
                  }
                  if (anim.data.isEffectActive(AnimationData.EffectType.EXPLODE, time)) {
                      anim.world.spawnParticles(ParticleTypes.EXPLOSION, cx, cy, cz, 2, 0.3, 0.3, 0.3, 0.05);
                      anim.world.spawnParticles(ParticleTypes.POOF, cx, cy, cz, 5, 0.4, 0.4, 0.4, 0.05);
                  }
                  if (anim.data.isEffectActive(AnimationData.EffectType.FIRE_EXPLODE, time)) {
                      anim.world.spawnParticles(ParticleTypes.EXPLOSION_EMITTER, cx, cy, cz, 1, 0.0, 0.0, 0.0, 0.0);
                      anim.world.spawnParticles(ParticleTypes.FLAME, cx, cy, cz, 12, 0.5, 0.5, 0.5, 0.08);
                      anim.world.spawnParticles(ParticleTypes.LAVA, cx, cy, cz, 4, 0.4, 0.4, 0.4, 0.05);
                  }

                  if (triggerEvents) {
                      float windowStart = anim.prevTime < 0 ? time - 0.05f : anim.prevTime;
                      for (AnimationData.SoundKeyframe sk : anim.data.soundKeyframes) {
                          if (sk.time > windowStart && sk.time <= time + 0.001f) {
                              Identifier id = Identifier.tryParse(sk.soundId);
                              if (id != null) {
                                  SoundEvent event = Registries.SOUND_EVENT.get(id);
                                  if (event != null) {
                                      anim.world.playSound(null, BlockPos.ofFloored(cx, cy, cz), event, SoundCategory.BLOCKS, 1.0f, 1.0f);
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > src/main/java/com/animateblock/AnimateBlockMod.java
          package com.animateblock;

          import com.animateblock.item.AnimateBlockItem;
          import com.animateblock.network.SyncTimelinePayload;
          import com.animateblock.server.ServerAnimationManager;
          import com.animateblock.timeline.AnimationData;
          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.fabricmc.fabric.api.itemgroup.v1.ItemGroupEvents;
          import net.fabricmc.fabric.api.networking.v1.PayloadTypeRegistry;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayConnectionEvents;
          import net.fabricmc.fabric.api.networking.v1.ServerPlayNetworking;
          import net.minecraft.item.Item;
          import net.minecraft.item.ItemGroups;
          import net.minecraft.item.ItemStack;
          import net.minecraft.registry.Registries;
          import net.minecraft.registry.Registry;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.util.Identifier;
          import net.minecraft.util.Rarity;

          public class AnimateBlockMod implements ModInitializer {
              public static final String MOD_ID = "animateblock";

              public static final Item ANIMATE_BLOCK_ITEM = Registry.register(
                      Registries.ITEM,
                      Identifier.of(MOD_ID, "animate_block"),
                      new AnimateBlockItem(new Item.Settings().maxCount(1).rarity(Rarity.EPIC))
              );

              @Override
              public void onInitialize() {
                  ItemGroupEvents.modifyEntriesEvent(ItemGroups.TOOLS).register(entries -> entries.add(ANIMATE_BLOCK_ITEM));

                  ServerPlayConnectionEvents.JOIN.register((handler, sender, server) -> {
                      ServerPlayerEntity player = handler.getPlayer();
                      boolean hasItem = false;
                      for (int i = 0; i < player.getInventory().size(); i++) {
                          if (player.getInventory().getStack(i).isOf(ANIMATE_BLOCK_ITEM)) {
                              hasItem = true;
                              break;
                          }
                      }
                      if (!hasItem) {
                          player.getInventory().insertStack(new ItemStack(ANIMATE_BLOCK_ITEM));
                      }
                  });

                  PayloadTypeRegistry.playC2S().register(SyncTimelinePayload.ID, SyncTimelinePayload.CODEC);

                  ServerPlayNetworking.registerGlobalReceiver(SyncTimelinePayload.ID, (payload, context) -> {
                      context.server().execute(() -> {
                          AnimationData data = AnimationData.fromNbt(payload.nbt());
                          ServerAnimationManager.updateOrStart(context.player().getServerWorld(), data, payload.stopAndRestore());
                      });
                  });

                  ServerTickEvents.END_SERVER_TICK.register(ServerAnimationManager::tick);
              }
          }
